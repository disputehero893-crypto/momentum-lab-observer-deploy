name: Worker tests
on:
  workflow_dispatch:
  push:
    branches:
      - fix/journal-growth-disk-guard
permissions:
  contents: read
jobs:
  python-worker-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Worker regression suite
        working-directory: worker
        run: |
          ln -sf "$(command -v python3)" /usr/local/bin/python || true
          python -m unittest discover -s tests -v
